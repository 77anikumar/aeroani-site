<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{root}}assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{root}}">Aero<span>Ani</span></a>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <nav class="nav">
{{nav}}
      </nav>
    </div>
  </header>

  <main>
{{content}}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© {{year}} Ani Kumar · All photographs by Ani Kumar</span>
      <nav>
        <a href="{{root}}photography/">Photography</a>
        <a href="https://www.youtube.com/@AeroAni" target="_blank" rel="noopener">YouTube</a>
        <a href="https://www.instagram.com/aero.ani/" target="_blank" rel="noopener">Instagram</a>
        <a href="{{root}}contact/">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="{{root}}assets/js/site.js" defer></script>
</body>
</html>
